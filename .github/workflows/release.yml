name: release

# Dispara ao empurrar uma tag "v*" (ex.: v1.2.3). Compila o binário Windows,
# gera os checksums SHA256 e cria a GitHub Release anexando o coletor, o
# instalador PontoPar-Setup e checksums.txt.
# É exatamente o layout que o auto-update (creativeprojects/go-selfupdate com
# ChecksumValidator{UniqueFilename:"checksums.txt"}) consome.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # necessário para criar a Release e anexar assets

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      - name: Build collector (windows/amd64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          $VERSION = "${{ github.ref_name }}"
          # Nome do asset DEVE casar o regex de OS/arch do go-selfupdate:
          #   {cmd}([_-]v?SEMVER)?([_-]{os}[_-]{arch})?(\.exe)?
          # onde {cmd} == "pontopar-coletor" (nome do exe instalado no cliente).
          $ASSET = "pontopar-coletor_${VERSION}_windows_amd64.exe"
          $SETUP_ASSET = "PontoPar-Setup_${VERSION}_windows_amd64.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          # -H windowsgui evita abrir uma janela de terminal quando o usuário
          # dá dois cliques no programa; a interface e a bandeja são nativas.
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$VERSION" -o "dist/$ASSET" ./cmd/pontopar-coletor
          "ASSET=$ASSET" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SETUP_ASSET=$SETUP_ASSET" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build standard Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --no-progress -y
          $Iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          $SetupBase = $env:SETUP_ASSET -replace '\.exe$',''
          $CompilerOutput = & $Iscc "/DMyAppVersion=$env:VERSION" "/DSourceExe=$pwd\dist\$env:ASSET" "/DSetupOutputBase=$SetupBase" "installer\pontopar.iss" 2>&1
          $CompilerOutput | ForEach-Object { Write-Host $_ }
          @("## Inno Setup compiler", "```text") + $CompilerOutput + "```" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($LASTEXITCODE -ne 0) {
            $Message = ($CompilerOutput -join ' | ') -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Host "::error title=Inno Setup compiler::$Message"
            exit 1
          }

      - name: Generate checksums.txt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location dist
          $Lines = @()
          foreach ($File in @($env:ASSET, $env:SETUP_ASSET)) {
            $Hash = (Get-FileHash -Algorithm SHA256 $File).Hash.ToLower()
            $Lines += "$Hash  $File"
          }
          $Lines | Set-Content -Encoding ascii checksums.txt
          Get-Content checksums.txt
          Pop-Location

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            dist/${{ env.ASSET }}
            dist/${{ env.SETUP_ASSET }}
            dist/checksums.txt
