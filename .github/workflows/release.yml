name: release

# Dispara ao empurrar uma tag "v*" (ex.: v1.2.3). Compila o binário Windows,
# gera os checksums SHA256 e cria a GitHub Release anexando o coletor, o
# instalador PontoPar-Setup e checksums.txt.
# É exatamente o layout que o auto-update (creativeprojects/go-selfupdate com
# ChecksumValidator{UniqueFilename:"checksums.txt"}) consome.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # necessário para criar a Release e anexar assets

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      - name: Build (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          # Nome do asset DEVE casar o regex de OS/arch do go-selfupdate:
          #   {cmd}([_-]v?SEMVER)?([_-]{os}[_-]{arch})?(\.exe)?
          # onde {cmd} == "pontopar-coletor" (nome do exe instalado no cliente).
          ASSET="pontopar-coletor_${VERSION}_windows_amd64.exe"
          SETUP_ASSET="PontoPar-Setup_${VERSION}_windows_amd64.exe"
          mkdir -p dist
          # -H windowsgui evita abrir uma janela de terminal quando o usuário
          # dá dois cliques no programa; a interface e a bandeja são nativas.
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${VERSION}" \
            -o "dist/${ASSET}" ./cmd/pontopar-coletor
          # O instalador é outro .exe: ele embute o coletor acima. A configuração
          # que vai ao GitHub é apenas o modelo sem segredos; o assistente pede os
          # campos necessários na instalação.
          cp "dist/${ASSET}" cmd/pontopar-installer/payload/pontopar-coletor.exe
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${VERSION}" \
            -o "dist/${SETUP_ASSET}" ./cmd/pontopar-installer
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"
          echo "SETUP_ASSET=${SETUP_ASSET}" >> "$GITHUB_ENV"

      - name: Generate checksums.txt
        run: |
          set -euo pipefail
          cd dist
          # Uma linha por arquivo: "<sha256>  <nome-do-arquivo>" (formato sha256sum).
          # O nome DEVE bater exatamente com o do asset publicado.
          sha256sum "${ASSET}" "${SETUP_ASSET}" > checksums.txt
          echo "----- checksums.txt -----"
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            dist/${{ env.ASSET }}
            dist/${{ env.SETUP_ASSET }}
            dist/checksums.txt
